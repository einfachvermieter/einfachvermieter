services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: einfachvermieter
    restart: unless-stopped
    # Aufruf im Browser: http://<host>:7273
    ports:
      - "7273:7273"
    environment:
      - NODE_ENV=production
      # Für serverseitige "heute"-Berechnung (todayIso, PDF-Ausstellungsdatum)
      - TZ=${TZ:-Europe/Berlin}
      # Benutzer, dem die Dateien unter /data gehoeren. Ohne diese Zeilen
      # laeuft die App als eingebauter Benutzer node (UID/GID 1000).
      # - PUID=1000
      # - PGID=1000
      # Einzige Daten-Wurzel (SQLite-DB, Uploads, Abrechnungs-PDFs).
      - DATA_DIR=/data
      # Standard: SQLite unter ${DATA_DIR}/einfachvermieter.db (kein DATABASE_URL noetig).
      # Fuer Postgres/MariaDB die naechsten zwei Zeilen einkommentieren:
      # - DB_DRIVER=postgres
      # - DATABASE_URL=postgres://user:pass@db:5432/einfachvermieter
      # Hinter einem Reverse-Proxy mit TLS (nginx-proxy-manager, Caddy,
      # Traefik, NAS-eigener Proxy): naechste Zeile einkommentieren, damit
      # Rate-Limit und Secure-Cookie die echte Verbindung sehen.
      # - TRUST_PROXY=1
      # Passwort-Richtlinie. Per Host-ENV/.env ueberschreibbar; Defaults bewusst
      # lasch (lokal gehostet). Fuer exponierte Deployments verschaerfen.
      - PASSWORD_MIN_LENGTH=${PASSWORD_MIN_LENGTH:-8}
      - PASSWORD_REQUIRE_UPPERCASE=${PASSWORD_REQUIRE_UPPERCASE:-false}
      - PASSWORD_REQUIRE_LOWERCASE=${PASSWORD_REQUIRE_LOWERCASE:-false}
      - PASSWORD_REQUIRE_DIGIT=${PASSWORD_REQUIRE_DIGIT:-false}
      - PASSWORD_REQUIRE_SPECIAL=${PASSWORD_REQUIRE_SPECIAL:-false}
      # Passwort vergessen: naechste Zeile einkommentieren, Container neu
      # starten, im Browser das neue Passwort setzen. Danach die Zeile wieder
      # auskommentieren und erneut neu starten. Solange sie gesetzt ist, ist
      # die App gesperrt.
      # - PASSWORD_RESET=GeheimesKennwort!1234
    volumes:
      # Pfad auf dem Host-System anpassen.
      - ./data:/data
