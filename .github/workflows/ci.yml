name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # .npmrc setzt ignore-scripts=true, daher native Module explizit bauen
      - name: Native Module bauen
        run: npm run rebuild:native

      - name: Lint & Format (Biome)
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build (inkl. Typecheck)
        run: npm run build
