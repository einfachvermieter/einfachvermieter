name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: Dependency-Audit
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: PDF-Asset-Tooling (fontTools + pyftfeatfreeze)
        run: pip install fonttools opentype-feature-freezer

      # .npmrc setzt ignore-scripts=true, daher Setup explizit
      # (rebuild:native + freeze-pdf-assets)
      - name: Setup (native Module + PDF-Assets)
        run: npm run setup

      - name: Lint & Format (Biome)
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build (inkl. Typecheck)
        run: npm run build

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Docker-Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
