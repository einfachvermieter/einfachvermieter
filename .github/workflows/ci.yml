name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: PDF-Asset-Tooling (pyftfeatfreeze)
        run: pipx install opentype-feature-freezer

      # .npmrc setzt ignore-scripts=true, daher Setup explizit
      # (rebuild:native + freeze-pdf-assets)
      - name: Setup (native Module + PDF-Assets)
        run: npm run setup

      - name: Lint & Format (Biome)
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build (inkl. Typecheck)
        run: npm run build
