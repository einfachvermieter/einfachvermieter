# Packaging-Konfiguration der Desktop-App (macOS + Windows).
# `staging/` wird von scripts/stage.mjs erzeugt und landet im Paket unter
# `resources/app`. Dort erwartet der Main-Prozess API-, Web-Build und
# node_modules.

appId: de.einfachvermieter.app
productName: EinfachVermieter
copyright: © 2026 Markus Baumer

directories:
  buildResources: build
  output: release

# Nur der gebündelte Main-Prozess wandert in die App-asar. Die
# Server-Ressourcen kommen als eigenes Archiv daneben (siehe stage.mjs), die
# nativen Module ausgepackt im Ordner mit der Endung `.unpacked`.
files:
  - dist/**
extraResources:
  - from: staging.asar
    to: server.asar
  - from: staging.asar.unpacked
    to: server.asar.unpacked
  # Eigener Eintrag, weil electron-builder das `node_modules` direkt unter
  # einer Quelle immer verwirft, bevor Filter greifen.
  - from: staging.asar.unpacked/node_modules
    to: server.asar.unpacked/node_modules

# Das Staging installiert seine node_modules selbst (npm ci + rebuild).
npmRebuild: false

# @TODO: echte Signierung/Notarisierung; bis dahin Ad-hoc-Signatur, sonst
# verweigert LaunchServices den Start auf Apple Silicon (siehe after-pack.cjs).
afterPack: scripts/after-pack.cjs

mac:
  category: public.app-category.finance
  target:
    - dmg
    - zip
  # @TODO: Signierung/Notarisierung (Developer-ID-Zertifikat), bis dahin
  # unsigniert bauen.
  identity: null

# Windows nur als MSIX über den Microsoft Store, der das Paket signiert.
win:
  target: appx

# Eigene Manifest-Vorlage, abgeleitet von der aus electron-builder. Einziger
# Unterschied ist die Abhaengigkeit auf die VC-Laufzeit
appx:
  # Vierte Stelle der Paketversion aus der Beta-Nummer, gesetzt von
  # scripts/dist-win.mjs.
  setBuildNumber: true
  customManifestPath: appxmanifest.xml
  identityName: MarkusBaumer.EinfachVermieter
  publisher: CN=FD0C43CC-D9B6-476B-BA29-D6534935A09B
  publisherDisplayName: Markus Baumer
  backgroundColor: "#1A222C"
