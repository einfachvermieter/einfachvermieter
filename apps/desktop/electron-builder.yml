# Packaging-Konfiguration der Desktop-App (macOS + Windows).
# `staging/` wird von scripts/stage.mjs erzeugt und landet im Paket unter
# `resources/app`. Dort erwartet der Main-Prozess API-, Web-Build und
# node_modules.

appId: de.einfachvermieter.app
productName: EinfachVermieter
copyright: © 2026 Markus Baumer

directories:
  buildResources: build
  output: release

# Nur der gebündelte Main-Prozess wandert in die asar; die Server-Ressourcen
# (inkl. nativer Module) liegen unverpackt unter resources/app.
# node_modules braucht einen eigenen Eintrag: electron-builder verwirft beim
# Kopieren das node_modules direkt unter der Quelle, bevor Filter greifen.
files:
  - dist/**
extraResources:
  - from: staging
    to: app
  - from: staging/node_modules
    to: app/node_modules

# Das Staging installiert seine node_modules selbst (npm ci + rebuild).
npmRebuild: false

# @TODO: echte Signierung/Notarisierung; bis dahin Ad-hoc-Signatur, sonst
# verweigert LaunchServices den Start auf Apple Silicon (siehe after-pack.cjs).
afterPack: scripts/after-pack.cjs

mac:
  category: public.app-category.finance
  target:
    - dmg
    - zip
  # @TODO: Signierung/Notarisierung (Developer-ID-Zertifikat), bis dahin
  # unsigniert bauen.
  identity: null

# Windows nur als MSIX über den Microsoft Store, der das Paket signiert.
win:
  target: appx

appx:
  identityName: MarkusBaumer.EinfachVermieter
  publisher: CN=FD0C43CC-D9B6-476B-BA29-D6534935A09B
  publisherDisplayName: Markus Baumer
  backgroundColor: "#1A222C"
